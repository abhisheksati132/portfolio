name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate --rule void-style:off --rule no-raw-characters:off index.html 404.html

      - name: Check JS syntax
        run: |
          node --check script.js
          node --check sw.js
          node --check tools/check-csp.mjs

      - name: Verify manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Verify CSP hashes match inline scripts
        run: node tools/check-csp.mjs

      - name: Check for broken links (non-blocking)
        continue-on-error: true
        uses: JustinBeckwith/linkinator-action@v2
        with:
          paths: index.html
          recurse: false
