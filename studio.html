<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhishek Sati | 3D Systems &amp; Software Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }
    .back-nav-badge {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.95rem;
      background: rgba(18, 18, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fafafa;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 0.825rem;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .back-nav-badge:hover {
      background: #ff5500;
      border-color: #ff5500;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .back-nav-badge:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body>
  <a href="/" class="back-nav-badge" aria-label="Return to portfolio">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span>Portfolio</span>
  </a>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
