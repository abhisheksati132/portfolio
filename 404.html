<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Abhishek Sati</title>
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2309090b'/><text x='50%' y='63%' font-size='44' font-family='monospace' font-weight='bold' fill='%23ff5500' text-anchor='middle'>AS</text></svg>" />
  <link rel="stylesheet" href="/styles.css?v=20261006" />
  <style>
    .notfound {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      text-align: center;
      gap: 1rem;
      padding: 2rem;
    }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 12vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.04em;
    }
    .notfound h1 {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .notfound p {
      color: var(--text-secondary);
      max-width: 420px;
      margin: 0 auto 1.25rem;
      line-height: 1.6;
    }
    .notfound-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <span class="notfound-code">404</span>
    <h1>Route not found</h1>
    <p>The requested endpoint or document does not exist. Return to the main engineering portfolio to explore projects.</p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-secondary" href="/#projects">Explore Projects</a>
    </div>
  </main>
</body>
</html>
