<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Abhishek Sati</title>
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FAF9F5'/><text x='50%' y='65%' font-size='50' font-family='monospace' font-weight='bold' fill='%23D97757' text-anchor='middle'>&lt;/&gt;</text></svg>" />
  <link rel="stylesheet" href="/styles.css?v=20260824" />
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-content: center;
      text-align: center;
      gap: 1rem;
      padding: 2rem;
    }
    .notfound-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 500;
      line-height: 1;
      color: var(--accent-text);
    }
    .notfound h1 {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 500;
    }
    .notfound p {
      color: var(--text-muted);
      max-width: 420px;
      margin: 0 auto 1rem;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <span class="notfound-code">404</span>
    <h1>This page wandered off the globe.</h1>
    <p>The link may be broken, or the page may have moved. Head back home to explore my projects instead.</p>
    <div>
      <a class="button button-primary" href="/">Back to Home</a>
      <a class="button button-secondary" href="/#projects">View Projects</a>
    </div>
  </main>
</body>
</html>
